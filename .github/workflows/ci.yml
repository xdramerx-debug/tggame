name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck · lint · unit · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run size
      - run: npm run check:dist

  e2e:
    name: E2E · ${{ matrix.project }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        project: [android-chrome-mobile, ios-webkit-mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Run e2e
        shell: bash
        run: |
          set -o pipefail
          npx playwright test --project=${{ matrix.project }} 2>&1 | tee pw-output.txt
        env:
          CI: '1'
      - if: failure()
        name: Publish failure log to step summary
        run: |
          {
            echo '## E2E failure — ${{ matrix.project }}'
            echo '```'
            tail -n 150 pw-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        name: Comment failure log on the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### E2E failure — ${{ matrix.project }} (run ${{ github.run_id }})"
            echo '```'
            tail -n 90 pw-output.txt
            echo '```'
          } > e2e-fail.md
          PR=$(gh pr list --head "${GITHUB_REF_NAME#refs/heads/}" --json number --jq '.[0].number // empty')
          if [ -n "$PR" ]; then gh pr comment "$PR" --body-file e2e-fail.md; fi
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.project }}
          path: |
            playwright-report
            test-results
          retention-days: 7
