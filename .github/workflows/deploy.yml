name: Deploy FREAKPIT

on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:dist
      # The Pages site must be the built app, never the repo root: the root
      # index.html points at /src/main.tsx and would show a blank boot shell.
      - name: Fail if the build is missing a real bundle
        run: |
          test -f dist/index.html
          test -n "$(ls dist/assets/*.js 2>/dev/null)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
