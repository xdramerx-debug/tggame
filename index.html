<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0B0E14" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="TENEBRIS — 3D roguelite survival RPG для Telegram" />
    <!-- Installed-app metadata. Icons are generated by `npm run assets` (scripts/icon.ts). -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./assets/icons/icon-192.png" />
    <title>TENEBRIS</title>
    <style>
      /* Critical inline styles: paint the dark backdrop before any JS/CSS chunk loads. */
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: #0b0e14;
        overscroll-behavior: none;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 40%, #1e2a3a 0%, #0b0e14 70%);
      }
      #boot span {
        font: 600 16px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif;
        letter-spacing: 0.32em;
        color: #c9a227;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="boot"><span>TENEBRIS</span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
